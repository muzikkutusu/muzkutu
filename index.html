<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14202b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Müzik Kutusu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=DM+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#f2ede4;--panel:#e6dfd2;--ink:#1d2a3a;--off:#cfc6b4;--on:#2f6f73;--hit:#e0a526;--muted:#5d6670;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14202b;--panel:#1c2b39;--ink:#f1ead9;--off:#2c3d4d;--on:#5fb3b3;--hit:#f2c14e;--muted:#9fb0bd}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:24px 16px 40px}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(2rem,7vw,3.2rem);margin:0 0 4px;letter-spacing:-.02em}
p.sub{margin:0 0 20px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--panel);padding:12px 14px;border-radius:14px;margin-bottom:16px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;background:var(--ink);color:var(--bg);cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:2px solid var(--ink)}
button:focus-visible,.cell:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--hit);outline-offset:2px}
label{display:flex;gap:8px;align-items:center;font-size:.95rem}
select{font:inherit;padding:8px;border-radius:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)}
input[type=range]{accent-color:var(--on)}
.grid{background:var(--panel);padding:14px;border-radius:14px;overflow-x:auto}
.row{display:grid;grid-template-columns:84px repeat(16,minmax(26px,1fr));gap:4px;margin-bottom:4px;min-width:700px;align-items:center}
.pair{display:flex;gap:2px}
.shapes .cell.now{background:var(--hit)}
.sharebox input[type=text]{font:inherit;padding:8px;border-radius:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)}
#chip{display:inline-block;background:var(--panel);padding:4px 12px;border-radius:999px;font-weight:600;margin-bottom:8px}
#chip[hidden]{display:none}
#pList{list-style:none;padding:0;margin:10px 0}
#pList li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--off)}
#pList .pn{flex:1;font-weight:600;overflow-wrap:anywhere}
.av{padding:4px 8px;font-size:1.3rem}
.shapes .cell[data-r="0"],.shapes .cell[data-r="1"],.shapes .cell[data-r="2"],.shapes .cell[data-r="3"],.shapes .cell[data-r="4"],.shapes .cell[data-r="5"]{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.shapes .cell[data-r="6"]{clip-path:inset(28% 0)}
.shapes .cell[data-r="7"]{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.shapes .cell[data-r="8"]{border-radius:50%}
.shapes .cell[data-r="9"]{clip-path:polygon(50% 0,100% 100%,0 100%)}
.shapes .cell[data-r="10"]{clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.shapes .cell[data-r="11"]{clip-path:polygon(22% 0,100% 0,78% 100%,0 100%)}
.shapes .cell[data-r="12"]{clip-path:polygon(50% 25%,60% 10%,78% 8%,92% 22%,92% 45%,50% 95%,8% 45%,8% 22%,22% 8%,40% 10%)}
.shapes .cell[data-r="13"]{clip-path:inset(0 26%)}
.shapes .cell[data-r="14"]{clip-path:inset(38% 0)}
.shapes .cell[data-r="15"]{border-radius:50% 50% 0 0}
.shapes .cell[data-r="16"]{clip-path:polygon(50% 0,82% 40%,100% 68%,88% 92%,50% 100%,12% 92%,0 68%,18% 40%)}
.shapes .cell[data-r="17"]{clip-path:polygon(0 12%,62% 12%,100% 50%,62% 88%,0 88%,30% 50%)}
.shapes .cell[data-r="18"]{clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%)}
button:disabled{opacity:.4;cursor:default}
.sharebox{background:var(--panel);padding:14px;border-radius:14px;margin-bottom:16px}
.sharebox[hidden]{display:none}
.sharebox p{margin:0 0 8px;color:var(--muted)}
.sharebox textarea{width:100%;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:8px;margin-bottom:8px}
.sharebox .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#ttl .ch{display:inline-block;animation:drop .9s both}
@keyframes drop{0%{transform:translateY(-420%) rotate(-35deg);opacity:0;animation-timing-function:cubic-bezier(.5,0,1,.6)}45%{transform:translateY(0) rotate(6deg);opacity:1;animation-timing-function:ease-out}62%{transform:translateY(-22%) rotate(-3deg);animation-timing-function:ease-in}78%{transform:translateY(0) rotate(1deg);animation-timing-function:ease-out}88%{transform:translateY(-6%)}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#ttl .ch{animation:none}}
#gol{background:#111;color:#fff;box-shadow:0 0 0 2px var(--ink);letter-spacing:.06em}.pair .cell{flex:1;min-width:0}
.name{font-weight:600;font-size:.9rem;cursor:pointer;user-select:none}
.name:hover{color:var(--on)}
.name:empty{cursor:default}
.name:focus-visible{outline:3px solid var(--hit);outline-offset:2px;border-radius:4px}
.cell{height:34px;border-radius:6px;background:var(--off);border:0;padding:0}
.cell.on{background:var(--on)}
.cell.beat{box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.cell.now{outline:3px solid var(--hit);outline-offset:-3px}
.row.head .cell{height:6px;background:transparent}
.row.head .cell.now{background:var(--hit);outline:0}
</style>
</head>
<body>
<main>
<div id="chip" hidden></div><h1 id="ttl">Müzik Kutusu</h1>
<p class="sub" id="sub">Kutulara dokun, döngüyü çal. Melodi satırları seçtiğin gamda kalır, o yüzden hep ahenkli çıkar.</p>
<div class="bar">
  <button id="play">Çal</button>
  <button id="rand" class="sec">Rastgele üret</button>
  <button id="clear" class="sec">Temizle</button>
  <button id="gol">GOL!</button>
  <button id="tribun" class="sec">Tribün ritmi</button>
  <button id="shapeBtn" class="sec" aria-pressed="false">Sembolleri değiştir</button>
  <button id="profBtn" class="sec">🎧 Profil</button>
  <button id="share" class="sec">Kaydet / Paylaş</button>
  <button id="export" class="sec">Müziği indir</button><span id="expMsg" role="status" style="color:var(--muted)"></span>
  <label><span id="lLang">Dil</span> <span id="flag" aria-hidden="true" style="font-size:1.5rem;line-height:1">🇹🇷</span><select id="lang">
    <option value="tr">Türkçe</option>
    <option value="en">English</option>
    <option value="pt">Português (Brasil)</option>
    <option value="fr">Français</option>
    <option value="ko">한국어</option>
    <option value="ja">日本語</option>
    <option value="zh">简体中文</option>
    <option value="tw">繁體中文（台灣）</option>
  </select></label>
  <label><span id="lTempo">Tempo</span> <input id="bpm" type="range" min="70" max="180" value="108"><span id="bpmv">108</span></label>
  <label><span id="lGam">Gam</span> <select id="scale">
    <option value="minor">La minör pentatonik</option>
    <option value="major">Do majör pentatonik</option>
    <option value="hijaz">Hicaz (Re)</option>
  </select></label>
</div>
<div class="sharebox" id="profbox" hidden>
<div class="acts"><span id="pAv" style="font-size:2.4rem;line-height:1" aria-hidden="true">🎧</span><div id="avs" class="acts"></div></div>
<div class="acts" style="margin-top:10px"><label><span id="lpName">Adın</span> <input type="text" id="pName" maxlength="24"></label></div>
<h2 id="pSongsT" style="font-size:1.1rem;margin:14px 0 8px">Şarkılarım</h2>
<div class="acts"><input type="text" id="pSongName" maxlength="30"><button id="pSave">Mevcut müziği kaydet</button><span id="pMsg" role="status" style="color:var(--muted)"></span></div>
<ul id="pList"></ul>
<button id="pClose" class="sec">Kapat</button>
</div>
<div class="sharebox" id="audiobox"><div class="acts">
<button id="songBtn" class="sec">Şarkı yükle</button><input type="file" id="songFile" accept="audio/*" hidden><span id="songName" style="color:var(--muted)"></span>
<label><span id="lVol">Şarkı sesi</span> <input id="songVol" type="range" min="0" max="100" value="70"></label>
<button id="songClear" class="sec" hidden>Kaldır</button>
<button id="convBtn" class="sec" disabled>Şarkıyı karelere çevir</button><span id="convMsg" role="status" style="color:var(--muted)"></span>
<button id="songMuteBtn" class="sec" disabled>Arkadaki müziği durdur</button><button id="gridMuteBtn" class="sec">Kareleri durdur</button>
<button id="sndBtn" class="sec">Ses yükle (satır)</button><input type="file" id="sndFile" accept="audio/*" hidden><span id="sndName" style="color:var(--muted)"></span>
</div></div>
<div class="sharebox" id="sharebox" hidden>
<p id="shareHint"></p>
<textarea id="code" rows="4" spellcheck="false"></textarea>
<div class="acts"><button id="copyCode">Kopyala</button><button id="loadCode" class="sec">Yükle</button><button id="closeShare" class="sec">Kapat</button><span id="shareMsg" role="status"></span></div>
</div>
<div class="grid" id="grid" aria-label="Ritim ve melodi ızgarası"></div>
<div id="extra"></div>
<div style="margin-top:16px;text-align:center;display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button id="more" class="sec">Daha fazla kutu</button><button id="less" class="sec" disabled>Son kutuyu sil</button></div>
</main>
<script>
(function(){
const STEPS=16;
let rec=null;
if(typeof AudioNode!=="undefined"){const _c=AudioNode.prototype.connect;AudioNode.prototype.connect=function(d,...a){if(rec&&ctx&&d===ctx.destination)_c.call(this,rec.dest);return _c.call(this,d,...a)}}
const SCALES={minor:[57,60,62,64,67,69],major:[60,62,64,67,69,72],hijaz:[62,63,66,67,69,70]};
const tracks=[
 {n:"Melodi",t:"lead",i:5},{n:"Melodi",t:"lead",i:4},{n:"Melodi",t:"lead",i:3},{n:"Melodi",t:"lead",i:2},{n:"Melodi",t:"lead",i:1},{n:"Melodi",t:"lead",i:0},
 {n:"Zil",t:"hat"},{n:"Trampet",t:"snare"},{n:"Davul",t:"kick"},{n:"Dık",t:"tik"},{n:"Akor",t:"strum"},{n:"Arpej",t:"arp"},{n:"Peluş",t:"squish"},{n:"Okul zili",t:"bell"},{n:"Kalem",t:"pencil"},{n:"Kapı zili",t:"door"},{n:"Yağmur",t:"rain"},{n:"Kuş",t:"bird"},{n:"Ses",t:"user"}
];
const names=["Melodi","","","","","","Zil","Trampet","Davul","Dık","Gitar akor","Gitar tel","Peluş","Okul zili","Kalem","Kapı zili","Yağmur","Kuş","Ses"];
const state=tracks.map(()=>Array(STEPS).fill(false));
let ctx,playing=false,step=0,nextTime=0,timer=null,scale="minor";
const grid=document.getElementById("grid"),cells=tracks.map(()=>[]),headCells=[];let bars=1;
const BARCOLORS=["#d94a4a","#3f9e5a","#8a5cc7","#e08a2b","#d6559a","#3f7fd0"];
function buildBar(bi){
  const g=bi===0?grid:document.createElement("div");
  if(bi>0){g.className="grid";g.style.marginTop="14px";g.style.setProperty("--on",BARCOLORS[(bi-1)%BARCOLORS.length]);document.getElementById("extra").appendChild(g);state.forEach(row=>{for(let i=0;i<STEPS;i++)row.push(false)})}
const head=document.createElement("div");head.className="row head";
head.appendChild(document.createElement("span"));

for(let s=0;s<STEPS;s++){const c=document.createElement("span");c.className="cell";head.appendChild(c);headCells.push(c)}
g.appendChild(head);
tracks.forEach((tr,r)=>{
  const row=document.createElement("div");row.className="row";
  const nm=document.createElement("span");nm.className="name";nm.textContent=names[r];
  if(r===0||r>=6){
    nm.tabIndex=0;nm.setAttribute("role","button");
    const hit=()=>{init();if(r===0){const t=ctx.currentTime+0.01;[0,1,2,3,4,5].forEach(k=>lead(t+k*0.12,k))}else preview(r)};
    nm.onclick=hit;nm.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();hit()}};
  }
  row.appendChild(nm);
  let pr;
  for(let s=0;s<STEPS;s++){
    const b=document.createElement("button");b.className="cell"+(s%4===0?" beat":"");
    b.setAttribute("aria-label",(names[r]||"Melodi")+" kare "+(Math.floor(s/2)+1)+(s%2?" ikinci yarı":" ilk yarı"));
    b.setAttribute("aria-pressed","false");
    const gs=bi*STEPS+s;b.dataset.r=r;b.onclick=()=>{toggle(r,gs);if(state[r][gs])init(),preview(r)};
    row.appendChild(b);cells[r].push(b);
  }
  g.appendChild(row);
});
}
buildBar(0);
function toggle(r,s,v){state[r][s]=v===undefined?!state[r][s]:v;cells[r][s].classList.toggle("on",state[r][s]);cells[r][s].setAttribute("aria-pressed",state[r][s])}
function init(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)()}if(ctx.state==="suspended")ctx.resume()}
function midi(n){return 440*Math.pow(2,(n-69)/12)}
function env(g,t,a,d,peak){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function lead(t,i){
  const f=midi(SCALES[scale][i]);
  [0,1].forEach(k=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=k?"triangle":"sawtooth";o.frequency.value=f;o.detune.value=k?7:-5;
    const fl=ctx.createBiquadFilter();fl.type="lowpass";fl.frequency.value=2400;
    env(g,t,0.01,0.35,k?0.12:0.07);
    o.connect(fl).connect(g).connect(ctx.destination);o.start(t);o.stop(t+0.5);
  });
}
function tik(t){const o=ctx.createOscillator(),g=ctx.createGain();o.type="triangle";o.frequency.setValueAtTime(1900,t);o.frequency.exponentialRampToValueAtTime(1200,t+0.03);env(g,t,0.002,0.05,0.5);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+0.08)}
function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.15);env(g,t,0.005,0.25,0.9);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+0.35)}
function noise(t,dur,hp,peak){
  const n=Math.floor(ctx.sampleRate*dur),buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=ctx.createBufferSource();s.buffer=buf;
  const f=ctx.createBiquadFilter();f.type="highpass";f.frequency.value=hp;
  const g=ctx.createGain();env(g,t,0.002,dur,peak);
  s.connect(f).connect(g).connect(ctx.destination);s.start(t);
}
const CH={minor:[0,1,3],major:[0,2,3],hijaz:[0,2,4]},pluckCache={};
function chord(){return CH[scale].map(i=>SCALES[scale][i])}
function pluckBuf(f){
  const key=Math.round(f*10);if(pluckCache[key])return pluckCache[key];
  const sr=ctx.sampleRate,len=Math.floor(sr*1.4),N=Math.max(2,Math.round(sr/f)),b=ctx.createBuffer(1,len,sr),d=b.getChannelData(0);
  for(let i=0;i<N;i++)d[i]=Math.random()*2-1;
  for(let i=1;i<N;i++)d[i]=0.5*(d[i]+d[i-1]);
  for(let i=N;i<len;i++)d[i]=0.5*(d[i-N]+d[i-N+1])*0.998;
  return pluckCache[key]=b;
}
function pluck(t,f,v){
  const s=ctx.createBufferSource();s.buffer=pluckBuf(f);
  const fl=ctx.createBiquadFilter();fl.type="lowpass";fl.frequency.value=3200;
  const g=ctx.createGain();g.gain.value=v;
  s.connect(fl).connect(g).connect(ctx.destination);s.start(t);
}
function pencil(t){
  const n=Math.floor(ctx.sampleRate*0.45),buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=ctx.createBufferSource();s.buffer=buf;
  const bp=ctx.createBiquadFilter();bp.type="bandpass";bp.Q.value=1.1;
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);
  for(let k=0;k<5;k++){
    const a=t+k*0.08;
    bp.frequency.setValueAtTime(k%2?4600:3300,a);
    g.gain.linearRampToValueAtTime(0.3+Math.random()*0.15,a+0.025);
    g.gain.linearRampToValueAtTime(0.04,a+0.07);
  }
  g.gain.linearRampToValueAtTime(0,t+0.42);
  s.connect(bp).connect(g).connect(ctx.destination);s.start(t);
}
function bell(t){
  const g=ctx.createGain(),am=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain();
  env(g,t,0.005,1.2,0.35);
  am.gain.value=0.5;l.type="square";l.frequency.value=24;lg.gain.value=0.5;
  l.connect(lg).connect(am.gain);
  [1250,1880,2630,3350].forEach((f,i)=>{
    const o=ctx.createOscillator(),og=ctx.createGain();
    o.type="sine";o.frequency.value=f;og.gain.value=0.5/(i+1);
    o.connect(og).connect(am);o.start(t);o.stop(t+1.4);
  });
  am.connect(g).connect(ctx.destination);
  l.start(t);l.stop(t+1.4);
}
function door(t){[[784,0],[622,0.4]].forEach(([f,d])=>{[1,2.01,3.02].forEach((m,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f*m;env(g,t+d,0.005,0.9,0.28/(i+1));o.connect(g).connect(ctx.destination);o.start(t+d);o.stop(t+d+1)})})}
function rain(t){
  const dur=0.9,n=Math.floor(ctx.sampleRate*dur),buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=ctx.createBufferSource();s.buffer=buf;
  const f=ctx.createBiquadFilter();f.type="highpass";f.frequency.value=3500;
  const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.15);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(g).connect(ctx.destination);s.start(t);
  for(let k=0;k<7;k++){const tt=t+Math.random()*0.7,o=ctx.createOscillator(),og=ctx.createGain(),fq=1200+Math.random()*1800;o.type="sine";o.frequency.setValueAtTime(fq,tt);o.frequency.exponentialRampToValueAtTime(fq*1.6,tt+0.04);env(og,tt,0.002,0.05,0.12);o.connect(og).connect(ctx.destination);o.start(tt);o.stop(tt+0.08)}
}
function bird(t){[0,0.12,0.24].forEach((d,k)=>{const o=ctx.createOscillator(),g=ctx.createGain(),a=t+d,f0=2800+k*300;o.type="sine";o.frequency.setValueAtTime(f0,a);o.frequency.exponentialRampToValueAtTime(f0*1.8,a+0.05);o.frequency.exponentialRampToValueAtTime(f0*1.2,a+0.09);env(g,a,0.005,0.09,0.25);o.connect(g).connect(ctx.destination);o.start(a);o.stop(a+0.13)})}
function squish(t){
  const f0=650+Math.random()*250,o=ctx.createOscillator(),g=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain();
  o.type="triangle";o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(f0*2,t+0.07);
  o.frequency.exponentialRampToValueAtTime(f0*1.4,t+0.2);
  l.frequency.value=38;lg.gain.value=25;l.connect(lg).connect(o.frequency);
  env(g,t,0.01,0.2,0.35);
  o.connect(g).connect(ctx.destination);
  o.start(t);o.stop(t+0.3);l.start(t);l.stop(t+0.3);
  noise(t,0.12,2500,0.1);
}
function strum(t){const c=chord().map(n=>n-12);c.unshift(c[0]-12);c.forEach((n,k)=>pluck(t+k*0.022,midi(n),0.45))}
function arp(t,s){const c=chord();pluck(t,midi(c[Math.floor(s/2)%c.length]),0.5)}
function play(r,t,s){
  const tr=tracks[r];
  if(tr.t==="lead")lead(t,tr.i);
  else if(tr.t==="kick")kick(t);
  else if(tr.t==="snare")noise(t,0.18,1200,0.35);
  else if(tr.t==="tik")tik(t);
  else if(tr.t==="strum")strum(t);

function yinPitch(x,sr,c){
  const W=1536,maxLag=Math.floor(sr/70),minLag=Math.floor(sr/1000);
  if(x.length<W+maxLag+2)return null;
  const st=Math.max(0,Math.min(x.length-W-maxLag-1,c-(W>>1)));
  const d=new Float32Array(maxLag+1);
  for(let t=1;t<=maxLag;t++){let s=0;for(let j=0;j<W;j+=2){const df=x[st+j]-x[st+j+t];s+=df*df}d[t]=s}

  for(let t=1;t<=maxLag;t++){run+=d[t];cm[t]=run?d[t]*t/run:1}
  let t=minLag;
  while(t<maxLag&&cm[t]>=0.15)t++;
  if(t>=maxLag){let bt=minLag;for(let k=minLag;k<maxLag;k++)if(cm[k]<cm[bt])bt=k;if(cm[bt]>0.25)return null;t=bt}
  else{while(t+1<maxLag&&cm[t+1]<cm[t])t++}
  return sr/t;
}
function analyzeSong(){
  const buf=songBuf,sr=buf.sampleRate,x=monoData(buf,Math.min(buf.length,Math.floor(sr*45)));
  const hop=512,nh=Math.floor(x.length/hop);
  if(nh<200)return null;
  const k=f=>1-Math.exp(-2*Math.PI*f/sr),aL=k(150),aM1=k(500),aM2=k(4000),aH=k(6000);
  let yL=0,yM1=0,yM2=0,yH=0;
  const eL=new Float32Array(nh),eM=new Float32Array(nh),eH=new Float32Array(nh),eT=new Float32Array(nh);
  for(let h=0;h<nh;h++){
    let sL=0,sM=0,sH=0,sT=0;
    for(let i=h*hop,e=i+hop;i<e;i++){
      const v=x[i];
      yL+=aL*(v-yL);yM1+=aM1*(v-yM1);yM2+=aM2*(v-yM2);yH+=aH*(v-yH);
      const m=yM2-yM1,hi=v-yH;
      sL+=yL*yL;sM+=m*m;sH+=hi*hi;sT+=v*v;
    }
    eL[h]=Math.sqrt(sL/hop);eM[h]=Math.sqrt(sM/hop);eH[h]=Math.sqrt(sH/hop);eT[h]=Math.sqrt(sT/hop);
  }
  const flux=e=>{const o=new Float32Array(nh);for(let h=1;h<nh;h++)o[h]=Math.max(0,e[h]-e[h-1]);return o};
  const mx=a=>{let m=0;for(let i=0;i<a.length;i++)if(a[i]>m)m=a[i];return m||1};
  const fL=flux(eL),fM=flux(eM),fH=flux(eH),nL=mx(fL),nM=mx(fM),nH=mx(fH),tot=mx(eT);
  const on=new Float32Array(nh);for(let h=0;h<nh;h++)on[h]=fL[h]/nL+fM[h]/nM+fH[h]/nH;
  const hr=sr/hop;let best=0,bpm=108;
  for(let b=70;b<=180;b++){
    const lag=Math.round(60/b*hr),l2=lag*2;let s=0,s2=0;
    for(let i=0;i+lag<nh;i++)s+=on[i]*on[i+lag];
    for(let i=0;i+l2<nh;i++)s2+=on[i]*on[i+l2];
    const w=Math.exp(-Math.pow((b-115)/45,2)/2),sc=(s/(nh-lag)+0.5*s2/Math.max(1,nh-l2))*w;
    if(sc>best){best=sc;bpm=b}
  }
  const sh=60/bpm/4*hr,bh=sh*4;
  let first=0;while(first<nh&&eT[first]<0.2*tot)first++;
  if(first>nh-120)return null;
  let bp=0,bs=-1;
  for(let p=0;p<bh;p++){let s=0,c=0;for(let t=first+p;t<nh-1;t+=bh){s+=on[Math.round(t)];c++}if(c&&s/c>bs){bs=s/c;bp=p}}
  const start=first+bp,nSteps=Math.min(128,Math.floor((nh-start)/sh)),bars2=Math.floor(nSteps/16);
  if(bars2<1)return null;
  const n=bars2*16;
  const thr=(a,kk)=>{let m=0;for(let h=start;h<nh;h++)m+=a[h];m/=(nh-start);let v=0;for(let h=start;h<nh;h++)v+=(a[h]-m)*(a[h]-m);return m+Math.sqrt(v/(nh-start))*kk};
  const tL=thr(fL,0.8),tM=thr(fM,0.9),tH=thr(fH,1.1),tO=thr(on,0.9);
  const pk=(a,h0,h1)=>{let m=0;for(let h=h0;h<=h1;h++)if(a[h]>m)m=a[h];return m};
  const sc=SCALES[scale],kick=[],snare=[],hat=[],mel=[];let prev=-1;
  for(let i=0;i<n;i++){
    const ts=start+i*sh,h0=Math.max(1,Math.round(ts-1)),h1=Math.min(nh-1,Math.round(ts+sh*0.6));
    const lo=pk(fL,h0,h1)>tL,mi=pk(fM,h0,h1)>tM,hi=pk(fH,h0,h1)>tH,strong=pk(on,h0,h1)>tO;
    kick[i]=lo;snare[i]=mi&&!lo;hat[i]=hi&&i%2===0;mel[i]=-1;
    const hc=Math.min(nh-1,Math.round(ts+sh*0.55));
    if(eT[hc]>0.15*tot){
      const f=yinPitch(x,sr,hc*hop);
      if(f&&f>70&&f<1100){
        const m=69+12*Math.log2(f/440);let bi=0,bd=99;
        sc.forEach((nn,j)=>{const dd=(((m-nn)%12)+12)%12,d=Math.min(dd,12-dd);if(d<bd){bd=d;bi=j}});
        if(bi!==prev||strong)mel[i]=bi;
        prev=bi;
      }
    }
  }
  return{bpm,bars:Math.min(8,bars2),kick,snare,hat,mel};
}

  init();const t=ctx.currentTime+0.05,dur=4.4;
  // tribün gürültüsü: yavaşça yükselip sönüyor
  const n=Math.floor(ctx.sampleRate*dur),buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const cs=ctx.createBufferSource();cs.buffer=buf;
  const bp=ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=900;bp.Q.value=0.6;
  const cg=ctx.createGain();cg.gain.setValueAtTime(0.0001,t);
  cg.gain.exponentialRampToValueAtTime(0.5,t+0.7);
  cg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  cs.connect(bp).connect(cg).connect(ctx.destination);cs.start(t);
  // kısa fanfar
  [60,64,67,72].forEach((m,i)=>horn(t+i*0.14,m,0.25));
  [72,76,79].forEach(m=>horn(t+0.7,m,1.4));
  [48,55].forEach(m=>horn(t+0.7,m,1.4));
  // tempo: çak çak çak-çak-çak
  [1.9,2.3,2.7,2.9,3.1,3.5,3.9,4.1].forEach(x=>noise(t+x,0.07,1500,0.5));
};
